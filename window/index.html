<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Town</title>
<style>
  :root {
    --bg: #14110d; --panel: #1e1a15; --panel2: #27211a; --line: #3a3127; --text: #efe4c8; --dim: #a8997a;
    --gold: #f5c542; --accent: #d97757; --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 44px 1fr; height: 100%; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .title { font-weight: 700; color: var(--gold); letter-spacing: .3px; }
  header .stat { color: var(--dim); white-space: nowrap; }
  header .stat b { color: var(--text); font-weight: 600; }
  header select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  header .grow { flex: 1; }
  #stage { position: relative; overflow: hidden; cursor: grab; background: #2b4a22; }
  #stage.dragging { cursor: grabbing; }
  canvas { position: absolute; inset: 0; image-rendering: pixelated; }
  .pad { position: absolute; right: 14px; bottom: 14px; display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; }
  .pad button, .zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: rgba(20,17,13,.78); color: var(--text); font-size: 15px; cursor: pointer; backdrop-filter: blur(4px); }
  .pad button:hover, .zoom button:hover { background: rgba(60,50,38,.92); }
  .zoom { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 4px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  aside h2 { margin: 2px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s; }
  .card:hover, .card.sel { border-color: var(--gold); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .card .name { font-weight: 600; }
  .role { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
  .status { margin-left: auto; font-size: 11px; }
  .status.working { color: var(--gold); }
  .status.idle { color: var(--dim); }
  .card .what { color: var(--dim); margin-top: 6px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .helpers { margin-top: 4px; font-size: 11px; color: #9fb0d8; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .actions button, .menu button { border: 1px solid var(--line); background: #332b22; color: var(--text); border-radius: 7px; padding: 5px 9px; cursor: pointer; font: inherit; font-size: 12px; }
  .actions button:hover, .menu button:hover { border-color: var(--gold); }
  .actions button.primary, .menu button.primary { background: var(--accent); border-color: var(--accent); color: #1b120c; font-weight: 600; }
  .menu { position: absolute; z-index: 5; width: 280px; background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); cursor: default; }
  .menu .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .menu .what { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .menu textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; }
  .menu .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--gold); border-radius: 999px; padding: 6px 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  .empty { color: var(--dim); padding: 30px 10px; text-align: center; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">⚑ Crew Town</span>
    <select id="task" title="Task"></select>
    <span class="stat" id="stats"></span>
    <span class="grow"></span>
    <span class="stat">drag to move · wheel to zoom · click a hero · <kbd>←↑↓→</kbd></span>
  </header>
  <div id="stage">
    <canvas id="view"></canvas>
    <div class="zoom"><button id="zout" title="Zoom out">−</button><button id="zin" title="Zoom in">+</button><button id="home" title="Back to the castle">⌂</button></div>
    <div class="pad">
      <span></span><button data-d="0,-1" title="Up">▲</button><span></span>
      <button data-d="-1,0" title="Left">◀</button><button data-d="0,1" title="Down">▼</button><button data-d="1,0" title="Right">▶</button>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <aside><h2>Crew</h2><div id="cards"></div></aside>
</div>
<script type="module">
import { World } from '/world.js'

const DEFAULT = 0x01000000, RAW = 0x02000000
const $ = id => document.getElementById(id)
const stage = $('stage'), canvas = $('view'), ctx = canvas.getContext('2d')
const off = document.createElement('canvas'), octx = off.getContext('2d')
const hex = c => '#' + (c & 0xffffff).toString(16).padStart(6, '0')
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

const world = new World()
world.minZoom = 1
world.resize(170, 100)
let snap = { sessions: [], tasks: [], task: null }
let taskId = null
let L = 8 // screen pixels per logical pixel
let camX = 0, camY = 0
let selected = null
let menu = null

function fit() {
  const r = stage.getBoundingClientRect()
  const dpr = window.devicePixelRatio || 1
  canvas.width = Math.round(r.width * dpr)
  canvas.height = Math.round(r.height * dpr)
  canvas.style.width = r.width + 'px'
  canvas.style.height = r.height + 'px'
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  clampCam()
}
function size() { const f = world.frameData(); return { w: f.W * L, h: f.H * L } }
function clampCam() {
  const r = stage.getBoundingClientRect(), s = size()
  camX = Math.max(Math.min(0, s.w - r.width), Math.min(camX, Math.max(0, s.w - r.width)))
  camY = Math.max(Math.min(0, s.h - r.height), Math.min(camY, Math.max(0, s.h - r.height)))
  if (s.w < r.width) camX = -(r.width - s.w) / 2
  if (s.h < r.height) camY = -(r.height - s.h) / 2
}
function home() {
  const r = stage.getBoundingClientRect(), s = size()
  camX = s.w / 2 - r.width / 2
  camY = 0
  clampCam()
}
let glide = null
function panBy(dx, dy) {
  const from = { x: camX, y: camY }, to = { x: camX + dx, y: camY + dy }, t0 = performance.now()
  glide = t => {
    const k = Math.min(1, (t - t0) / 260), e = 1 - Math.pow(1 - k, 3)
    camX = from.x + (to.x - from.x) * e
    camY = from.y + (to.y - from.y) * e
    clampCam()
    if (k >= 1) glide = null
  }
}

// ---- data

async function poll() {
  try {
    const q = new URLSearchParams(location.search)
    const r = await fetch('/api/snap?' + new URLSearchParams({ ...(taskId ? { task: taskId } : {}), ...(q.get('demo') ? { demo: '1' } : {}), ...(q.get('town') ? { town: q.get('town'), project: q.get('project') ?? '' } : {}) }))
    snap = await r.json()
    taskId = snap.task
    world.sync({ ...snap, now: Date.now() })
    const info = world.scrollInfo
    if (info.rows > info.view) world.resize(170, Math.ceil(info.rows) + 1)
    renderSide()
  } catch {
    $('stats').textContent = 'the town server stopped: run /crew-town window again'
  }
}

function renderSide() {
  const sel = $('task')
  sel.innerHTML = snap.tasks.map(t => `<option value="${esc(t.id)}" ${t.id === snap.task ? 'selected' : ''}>${esc(t.name)} · ${esc(t.project)}</option>`).join('') || '<option>no tasks</option>'
  const crew = snap.sessions
  const t = snap.tasks.find(x => x.id === snap.task)
  const busy = crew.filter(s => s.status === 'working').length
  const helpers = crew.reduce((n, s) => n + s.agents.length, 0)
  const feats = crew.flatMap(s => s.features ?? [])
  $('stats').innerHTML = t
    ? (snap.tasks.length > 1 ? `<b>${snap.tasks.length}</b> crews · ` : `Lead <b>${esc(t.lead)}</b> · `) + `<b>${crew.length}</b> at work, <b>${busy}</b> busy · <b>${helpers}</b> helpers · features <b>${feats.filter(f => f.status === 'done').length}/${feats.length}</b>` + (snap.bored ? ' · <b style="color:var(--gold)">they want work!</b>' : '')
    : 'No crew yet: start a task with /crew-task in a Claude Code session.'
  $('cards').innerHTML = crew.length ? crew.map(s => `
    <div class="card ${selected === s.id ? 'sel' : ''}" data-id="${esc(s.id)}">
      <div class="top"><span class="dot" style="background:${esc(s.color)}"></span><span class="name">${esc(s.name)}</span><span class="role">${esc(s.task ? s.task.role : 'overseer')}${s.task && snap.tasks.length > 1 ? ' · ' + esc(s.task.name) : ''}</span>
        <span class="status ${s.status}">${s.status === 'working' ? '● working' : '○ idle'}</span></div>
      <div class="what" title="${esc(s.detail || s.lastPrompt)}">${esc(s.status === 'working' && s.detail ? s.detail : s.lastPrompt ? 'on: ' + s.lastPrompt : 'waiting for orders')}</div>
      ${s.agents.length ? `<div class="helpers">⚒ ${s.agents.map(a => esc(a.desc)).join(' · ')}</div>` : ''}
      <div class="actions">
        <button class="primary" data-act="work" data-id="${esc(s.id)}">Give work…</button>
        <button data-act="idea" data-id="${esc(s.id)}">Idea</button>
        <button data-act="focus" data-id="${esc(s.id)}" title="Bring its terminal window to the front">Window</button>
      </div>
    </div>`).join('') : '<div class="empty">No one here yet.</div>'
}

// ---- drawing

// The world's canvas has half-wide pixels; doubling its rows makes them square, and Scale2x
// then rounds every diagonal edge, so each world pixel is drawn as 4x4 finer ones.
let sq = new Uint32Array(0), big = new Uint32Array(0), img = null
function scale2x(src, w, h, dst) {
  const W2 = w * 2
  for (let y = 0; y < h; y++) {
    const up = y > 0 ? (y - 1) * w : y * w, row = y * w, dn = y < h - 1 ? (y + 1) * w : y * w
    for (let x = 0; x < w; x++) {
      const P = src[row + x]
      const A = src[up + x], D = src[dn + x]
      const C = x > 0 ? src[row + x - 1] : P, B = x < w - 1 ? src[row + x + 1] : P
      let e0 = P, e1 = P, e2 = P, e3 = P
      if (C === A && C !== D && A !== B) e0 = A
      if (A === B && A !== C && B !== D) e1 = B
      if (D === C && D !== B && C !== A) e2 = C
      if (B === D && B !== A && D !== C) e3 = D
      const o = y * 2 * W2 + x * 2
      dst[o] = e0; dst[o + 1] = e1; dst[o + W2] = e2; dst[o + W2 + 1] = e3
    }
  }
}

function frame(now, dt) {
  world.step(Date.now(), dt)
  world.draw()
  const f = world.frameData()
  const w = f.FW, h = f.H * 2
  if (sq.length !== w * h) {
    sq = new Uint32Array(w * h)
    big = new Uint32Array(w * h * 4)
    off.width = w * 2; off.height = h * 2
    img = octx.createImageData(w * 2, h * 2)
  }
  for (let y = 0; y < f.H; y++) {
    for (let x = 0; x < w; x++) {
      const c = f.px[y * w + x] ?? 0
      const abgr = 0xff000000 | ((c & 255) << 16) | (c & 0xff00) | ((c >> 16) & 255)
      sq[y * 2 * w + x] = abgr
      sq[(y * 2 + 1) * w + x] = abgr
    }
  }
  scale2x(sq, w, h, big)
  new Uint32Array(img.data.buffer).set(big)
  octx.putImageData(img, 0, 0)
  const r = stage.getBoundingClientRect()
  ctx.imageSmoothingEnabled = false
  ctx.fillStyle = '#16130f'
  ctx.fillRect(0, 0, r.width, r.height)
  ctx.drawImage(off, 0, 0, off.width, off.height, -camX, -camY, f.FW * L / 2, f.H * L)
  drawTexts(f)
}

// the world writes its words into terminal cells; here they become labels and speech bubbles
function drawTexts(f) {
  const runs = []
  const keys = [...f.text.keys()].sort((a, b) => a - b)
  let run = null
  for (const k of keys) {
    const [cp, fg, bg] = f.text.get(k)
    const x = k % f.W, y = Math.floor(k / f.W)
    if (run && run.y === y && run.x + run.s.length === x && run.fg === fg && run.bg === bg) run.s += String.fromCodePoint(cp)
    else { if (run) runs.push(run); run = { x, y, s: String.fromCodePoint(cp), fg, bg } }
  }
  if (run) runs.push(run)
  const fs = Math.max(10, Math.round(L * 1.9))
  ctx.font = `600 ${fs}px ui-sans-serif, -apple-system, sans-serif`
  ctx.textBaseline = 'middle'
  ctx.textAlign = 'center'
  // bubbles first so they keep their place; names step aside when they would overlap
  runs.sort((a, b) => (a.bg === DEFAULT) - (b.bg === DEFAULT))
  const placed = []
  const free = (x, y, w, h) => !placed.some(p => x < p.x + p.w && x + w > p.x && y < p.y + p.h && y + h > p.y)
  for (const r of runs) {
    const cx = (r.x + r.s.length / 2) * L - camX
    let cy = (r.y * 2 + 1) * L - camY
    const text = r.s.trim()
    if (r.bg === RAW) { // a bubble's tail
      ctx.fillStyle = hex(r.fg)
      ctx.beginPath(); ctx.moveTo(cx - L, cy - L); ctx.lineTo(cx + L, cy - L); ctx.lineTo(cx, cy + L * 0.6); ctx.fill()
      continue
    }
    if (!text) continue
    const w = ctx.measureText(text).width + fs * 0.9
    if (/^[█░]+$/.test(text)) { // the token gauge
      const full = [...r.s].filter(c => c === '█').length
      ctx.fillStyle = 'rgba(0,0,0,.45)'; round(cx - r.s.length * L / 2, cy - L * 0.6, r.s.length * L, L * 1.2, L * 0.6)
      ctx.fillStyle = hex(r.fg); round(cx - r.s.length * L / 2, cy - L * 0.6, full * L, L * 1.2, L * 0.6)
      continue
    }
    const h = fs * 1.5
    for (let k = 0; k < 4 && !free(cx - w / 2, cy - h / 2, w, h); k++) cy += r.bg === DEFAULT ? h * 0.95 : -h * 0.95
    placed.push({ x: cx - w / 2, y: cy - h / 2, w, h })
    if (r.bg === DEFAULT) { // a name or a sign
      ctx.fillStyle = 'rgba(15,12,9,.62)'; round(cx - w / 2, cy - fs * 0.7, w, fs * 1.4, fs * 0.7)
      ctx.fillStyle = hex(r.fg); ctx.fillText(text, cx, cy + 1)
    } else { // a speech bubble or a banner
      ctx.fillStyle = hex(r.bg); round(cx - w / 2, cy - fs * 0.75, w, fs * 1.5, fs * 0.5)
      ctx.fillStyle = hex(r.fg); ctx.fillText(text, cx, cy + 1)
    }
  }
}
function round(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill() }

let last = performance.now()
function loop(t) {
  if (glide) glide(t)
  frame(t, Math.min(100, t - last))
  last = t
  requestAnimationFrame(loop)
}

// ---- orders

async function order(id, kind, text = '') {
  const r = await fetch('/api/order', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id, kind, text }) })
  const j = await r.json().catch(() => ({}))
  const name = snap.sessions.find(s => s.id === id)?.name ?? 'that member'
  toast(j.ok ? (kind === 'focus' ? `Brought ${name}'s window to the front` : `Orders sent to ${name}`) : j.error || (kind === 'focus' ? 'Could not find its window' : 'Could not send'))
}
let toastTimer = 0
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('on')
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600)
}

function openMenu(id, x, y, typing = false) {
  closeMenu()
  const s = snap.sessions.find(m => m.id === id)
  if (!s) return
  selected = id
  renderSide()
  const m = document.createElement('div')
  m.className = 'menu'
  m.innerHTML = `
    <div class="head"><span class="dot" style="background:${esc(s.color)}"></span><b>${esc(s.name)}</b><span class="role">${esc(s.task ? s.task.role : 'overseer')}${s.task && snap.tasks.length > 1 ? ' · ' + esc(s.task.name) : ''}</span></div>
    <div class="what">${esc(s.status === 'working' && s.detail ? s.detail : s.lastPrompt ? 'on: ' + s.lastPrompt : 'waiting for orders')}</div>
    ${typing ? `<textarea placeholder="What should ${esc(s.name)} work on?"></textarea>
      <div class="row"><button class="primary" data-go="send">Send</button><button data-go="back">Back</button></div>`
    : `<div class="row"><button class="primary" data-go="work">Give work…</button><button data-go="idea">Come up with an idea</button></div>
       <div class="row"><button data-go="focus">Go to its window</button><button data-go="cancel">Cancel</button></div>`}`
  const r = stage.getBoundingClientRect()
  m.style.left = Math.min(Math.max(8, x + 12), r.width - 296) + 'px'
  m.style.top = Math.min(Math.max(8, y - 20), r.height - 200) + 'px'
  m.addEventListener('mousedown', e => e.stopPropagation())
  m.addEventListener('click', e => {
    const go = e.target.dataset?.go
    if (go === 'work') openMenu(id, x, y, true)
    else if (go === 'back') openMenu(id, x, y)
    else if (go === 'send') { const v = m.querySelector('textarea').value.trim(); if (v) { order(id, 'work', v); closeMenu() } }
    else if (go === 'idea') { order(id, 'idea'); closeMenu() }
    else if (go === 'focus') { order(id, 'focus'); closeMenu() }
    else if (go === 'cancel') closeMenu()
  })
  stage.appendChild(m)
  menu = m
  const ta = m.querySelector('textarea')
  if (ta) {
    ta.focus()
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); m.querySelector('[data-go=send]').click() } })
  }
}
function closeMenu() { menu?.remove(); menu = null; selected = null; renderSide() }

// ---- input

let drag = null
stage.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, cx: camX, cy: camY, moved: false }; stage.classList.add('dragging') })
window.addEventListener('mousemove', e => {
  if (!drag) return
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true
  camX = drag.cx - dx; camY = drag.cy - dy; clampCam()
})
window.addEventListener('mouseup', e => {
  stage.classList.remove('dragging')
  const d = drag; drag = null
  if (!d || d.moved || e.target.closest('.pad, .zoom, .menu')) return
  const r = stage.getBoundingClientRect()
  const mx = e.clientX - r.left, my = e.clientY - r.top
  const lx = (mx + camX) / L, ly = (my + camY) / L
  const hit = world.heroes().map(h => ({ h, d: Math.hypot(lx - (h.x + 3.5), (ly - (h.y + 5)) * 0.7) })).filter(o => o.d < 7).sort((a, b) => a.d - b.d)[0]
  if (hit) openMenu(hit.h.id, mx, my)
  else closeMenu()
})
stage.addEventListener('wheel', e => {
  e.preventDefault()
  const r = stage.getBoundingClientRect()
  const mx = e.clientX - r.left, my = e.clientY - r.top
  const before = L
  L = Math.max(3, Math.min(14, L * (e.deltaY < 0 ? 1.12 : 1 / 1.12)))
  camX = (camX + mx) * (L / before) - mx
  camY = (camY + my) * (L / before) - my
  clampCam()
}, { passive: false })
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('click', () => {
  const [dx, dy] = b.dataset.d.split(',').map(Number)
  const r = stage.getBoundingClientRect()
  panBy(dx * r.width * 0.4, dy * r.height * 0.4)
}))
$('zin').onclick = () => { L = Math.min(14, L * 1.25); clampCam() }
$('zout').onclick = () => { L = Math.max(3, L / 1.25); clampCam() }
$('home').onclick = () => home()
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') closeMenu(); return }
  const step = 160
  if (e.key === 'ArrowLeft') panBy(-step, 0)
  else if (e.key === 'ArrowRight') panBy(step, 0)
  else if (e.key === 'ArrowUp') panBy(0, -step)
  else if (e.key === 'ArrowDown') panBy(0, step)
  else if (e.key === 'Escape') closeMenu()
})
$('cards').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]')
  if (b) {
    const { act, id } = b.dataset
    if (act === 'work') { const r = stage.getBoundingClientRect(); openMenu(id, r.width - 320, 40, true) }
    else order(id, act)
    return
  }
  const card = e.target.closest('.card')
  if (card) { const r = stage.getBoundingClientRect(); openMenu(card.dataset.id, r.width - 320, 40) }
})
$('task').addEventListener('change', e => { taskId = e.target.value; poll() })
window.addEventListener('resize', fit)

fit()
await poll()
home()
setInterval(poll, 2000)
requestAnimationFrame(loop)
</script>
</body>
</html>
